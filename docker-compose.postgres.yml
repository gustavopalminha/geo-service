version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_DB: geodata
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geodata"]
      interval: 10s
      timeout: 5s
      retries: 5

  geo-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - DB_TYPE=postgres
      - DATASOURCE_STRING=postgresql://geouser:geopass@postgres:5432/geodata
      - DB_SCHEMA=${DB_SCHEMA:-public}
      - DB_TABLE=${DB_TABLE:-}
      - HOST=0.0.0.0
      - PORT=${PORT:-8090}
      - API_ROOT=${API_ROOT:-/geo}
      - API_SUBPATH=${API_SUBPATH:-}
      - API_TYPE_PATH=${API_TYPE_PATH:-/types}
      - ALLOWED_CRUD=${ALLOWED_CRUD:-R}
      - SERVICE_HEADER=${SERVICE_HEADER:-}
      - CORS_ACCEPTED=${CORS_ACCEPTED:-*}
    restart: unless-stopped

volumes:
  postgres_data:
